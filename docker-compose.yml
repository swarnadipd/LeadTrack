services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: leadtrack
      POSTGRES_PASSWORD: leadtrack
      POSTGRES_DB: leadtrack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadtrack -d leadtrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  api1:
    build: .
    environment:
      DATABASE_URL: postgresql://leadtrack:leadtrack@db:5432/leadtrack
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.7-flash}
    depends_on:
      db:
        condition: service_healthy

  api2:
    build: .
    environment:
      DATABASE_URL: postgresql://leadtrack:leadtrack@db:5432/leadtrack
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.7-flash}
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    volumes:
      - ./Ngnix/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api1
      - api2

volumes:
  pgdata:
