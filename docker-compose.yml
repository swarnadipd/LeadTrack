services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: leadtrack
      POSTGRES_PASSWORD: leadtrack
      POSTGRES_DB: leadtrack
    volumes:
      - pgdata:/var/lib/postgresql/data

  api1:
    build: .
    environment:
      DATABASE_URL: postgresql://leadtrack:leadtrack@db:5432/leadtrack
    depends_on:
      - db

  api2:
    build: .
    environment:
      DATABASE_URL: postgresql://leadtrack:leadtrack@db:5432/leadtrack
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api1
      - api2

volumes:
  pgdata:
